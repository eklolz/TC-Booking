<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TC Hood Booking</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧪</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg: #F7F6F2;
    --ink: #20262B;
    --ink-soft: #5B6560;
    --steel: #DDE1D8;
    --steel-dark: #AEB6AC;
    --card: #FFFFFF;

    --free-tint: #FCE7EC;
    --free-strong: #D85C7A;

    --mine-tint: #ECD9EE;
    --mine-strong: #8C4A93;

    --taken-tint: #FBE8C9;
    --taken-strong: #B97A22;

    --radius: 6px;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'Inter', sans-serif;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }

  .app{
    max-width: 980px;
    margin: 0 auto;
    padding: 20px 16px 48px;
  }

  /* ---- Header "nameplate" ---- */
  .plate{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    background: var(--card);
    border: 1px solid var(--steel);
    border-top: 3px solid var(--ink);
    border-radius: var(--radius);
    padding: 16px 20px;
    flex-wrap: wrap;
  }
  .plate__kicker{
    display:block;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--ink-soft);
    margin-bottom: 2px;
  }
  .plate__title{
    margin:0;
    font-family: var(--mono);
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.01em;
  }
  .plate__user{
    display:flex;
    align-items:center;
    gap:8px;
    font-size: 13px;
  }
  .plate__user-label{ color: var(--ink-soft); }
  .plate__user-name{ font-weight: 600; }
  .plate__user-missing{ color: var(--ink-soft); font-style: italic; }

  /* ---- Buttons ---- */
  .btn{
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 600;
    border-radius: 4px;
    border: 1px solid var(--steel-dark);
    background: var(--card);
    color: var(--ink);
    padding: 6px 12px;
    cursor: pointer;
    transition: background-color 120ms ease, border-color 120ms ease;
  }
  .btn:hover{ background: var(--steel); }
  .btn:focus-visible{ outline: 2px solid var(--ink); outline-offset: 2px; }
  .btn--ghost{ background: transparent; border-color: transparent; text-decoration: underline; padding: 4px 6px; }
  .btn--ghost:hover{ background: var(--steel); text-decoration: none; }
  .btn--icon{ width: 32px; padding: 6px 0; text-align:center; font-size: 16px; line-height:1; }
  .btn--text{ border-color: transparent; }
  .btn--primary{ background: var(--ink); color: #fff; border-color: var(--ink); }
  .btn--primary:hover{ background: #353d41; }

  /* ---- Hood tabs ---- */
  .hood-tabs{
    display:flex;
    gap:6px;
    margin-bottom: 12px;
  }
  .hood-tab{
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 600;
    border-radius: 4px;
    border: 1px solid var(--steel-dark);
    background: var(--card);
    color: var(--ink-soft);
    padding: 6px 14px;
    cursor: pointer;
  }
  .hood-tab:hover{ background: var(--steel); }
  .hood-tab--active{
    background: var(--ink);
    color: #fff;
    border-color: var(--ink);
  }

  /* ---- Toolbar ---- */
  .toolbar{
    display:flex;
    align-items:center;
    justify-content: space-between;
    gap: 16px;
    margin: 18px 0 12px;
    flex-wrap: wrap;
  }
  .week-nav{ display:flex; align-items:center; gap:8px; }
  .week-label{
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 500;
    min-width: 170px;
    text-align: center;
  }
  .legend{ display:flex; gap:14px; flex-wrap: wrap; }
  .legend__item{
    display:flex; align-items:center; gap:6px;
    font-size: 12px; color: var(--ink-soft);
  }
  .swatch{ width:11px; height:11px; border-radius: 2px; display:inline-block; }
  .swatch--free{ background: var(--free-tint); border:1px solid var(--free-strong); }
  .swatch--mine{ background: var(--mine-tint); border:1px solid var(--mine-strong); }
  .swatch--taken{ background: var(--taken-tint); border:1px solid var(--taken-strong); }

  /* ---- Set-name banner ---- */
  .banner{
    display:flex; align-items:center; justify-content:space-between;
    gap:12px;
    background: #FFF7E6;
    border: 1px solid #E7CE93;
    border-radius: var(--radius);
    padding: 10px 14px;
    margin-bottom: 12px;
    font-size: 13px;
  }

  .config-warning{
    background: #FDEBEA;
    border: 1px solid #E7A39C;
    border-radius: var(--radius);
    padding: 12px 14px;
    margin-bottom: 12px;
    font-size: 13px;
    font-family: var(--mono);
  }

  /* ---- Grid ---- */
  .grid-wrap{
    overflow-x: auto;
    border: 1px solid var(--steel);
    border-radius: var(--radius);
    background: var(--card);
  }
  .grid{
    display: grid;
    min-width: 760px;
  }
  .cell{
    border-bottom: 1px solid var(--steel);
    border-right: 1px solid var(--steel);
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 8px 4px;
  }
  .cell--corner{
    position: sticky;
    left: 0; top: 0;
    z-index: 3;
    background: var(--card);
  }
  .cell--day{
    position: sticky;
    top: 0;
    z-index: 2;
    background: var(--card);
    flex-direction: column;
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.3;
    padding: 10px 4px;
  }
  .cell--day strong{ font-size: 13px; }
  .cell--time{
    position: sticky;
    left: 0;
    z-index: 1;
    background: var(--card);
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink-soft);
    white-space: nowrap;
  }

  .slot{
    width: 100%;
    height: 100%;
    min-height: 44px;
    border: none;
    background: var(--free-tint);
    border-radius: 3px;
    margin: 3px;
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 600;
    color: var(--free-strong);
    cursor: pointer;
    transition: transform 120ms ease, background-color 120ms ease;
  }
  .slot:hover{ background: #F8C6D2; transform: translateY(-1px); }
  .slot:focus-visible{ outline: 2px solid var(--ink); outline-offset: 1px; }

  .slot--mine{ background: var(--mine-tint); color: var(--mine-strong); }
  .slot--mine:hover{ background: #DCB9E0; }

  .slot--taken{ background: var(--taken-tint); color: var(--taken-strong); cursor: default; }
  .slot--taken:hover{ background: var(--taken-tint); transform: none; }

  .slot__name{
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    padding: 0 4px;
  }

  .footnote{
    margin-top: 14px;
    font-size: 12px;
    color: var(--ink-soft);
  }

  .skeleton{
    padding: 40px 0;
    text-align: center;
    color: var(--ink-soft);
    font-family: var(--mono);
    font-size: 13px;
  }

  .toast{
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    background: var(--ink);
    color: #fff;
    padding: 10px 16px;
    border-radius: 6px;
    font-size: 13px;
    z-index: 10;
    max-width: 90vw;
  }

  /* ---- Mobile day-list view ---- */
  .day-view{ display:none; }
  .day-nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom: 10px;
  }
  .day-nav__label{
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 600;
    text-align:center;
    flex:1;
  }
  .day-list{
    border: 1px solid var(--steel);
    border-radius: var(--radius);
    background: var(--card);
    overflow: hidden;
  }
  .day-row{
    display:flex;
    align-items:center;
    gap:12px;
    border-bottom: 1px solid var(--steel);
    padding: 10px 12px;
  }
  .day-row:last-child{ border-bottom: none; }
  .day-row__time{
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink-soft);
    width: 92px;
    flex-shrink: 0;
  }
  .day-row__slot{
    flex:1;
    min-height: 44px;
    border: none;
    border-radius: 4px;
    background: var(--free-tint);
    color: var(--free-strong);
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    padding: 10px 12px;
    text-align: left;
  }
  .day-row__slot--mine{ background: var(--mine-tint); color: var(--mine-strong); }
  .day-row__slot--taken{ background: var(--taken-tint); color: var(--taken-strong); cursor: default; }

  @media (prefers-reduced-motion: reduce){
    .slot, .btn{ transition: none; }
  }

  @media (max-width: 560px){
    .plate{ padding: 12px 14px; }
    .plate__title{ font-size: 17px; }
    .toolbar{ justify-content: center; }
  }

  @media (max-width: 640px){
    .grid-wrap{ display:none; }
    .day-view{ display:block; }
    .toolbar .week-nav{ display:none; }
  }
</style>
</head>
<body>

<div class="app">

  <header class="plate">
    <div>
      <span class="plate__kicker">FGM LAB · SHARED RESOURCE</span>
      <h1 class="plate__title">TC Hood Booking</h1>
    </div>
    <div class="plate__user" id="userBlock"></div>
  </header>

  <div id="configWarning"></div>
  <div id="bannerSlot"></div>

  <div class="hood-tabs" id="hoodTabs"></div>

  <div class="toolbar">
    <div class="week-nav">
      <button class="btn btn--icon" id="prevWeek" aria-label="Previous week">‹</button>
      <div class="week-label" id="weekLabel">—</div>
      <button class="btn btn--icon" id="nextWeek" aria-label="Next week">›</button>
      <button class="btn btn--text" id="thisWeek">Today</button>
    </div>
    <div class="legend">
      <span class="legend__item"><span class="swatch swatch--free"></span>Available</span>
      <span class="legend__item"><span class="swatch swatch--mine"></span>Yours</span>
      <span class="legend__item"><span class="swatch swatch--taken"></span>Booked</span>
    </div>
  </div>

  <div class="grid-wrap" id="gridWrap">
    <div class="skeleton">Loading schedule…</div>
  </div>

  <div class="day-view" id="dayView">
    <div class="day-nav">
      <button class="btn btn--icon" id="prevDay" aria-label="Previous day">‹</button>
      <div class="day-nav__label" id="dayNavLabel">—</div>
      <button class="btn btn--icon" id="nextDay" aria-label="Next day">›</button>
    </div>
    <div class="day-list" id="dayListWrap">
      <div class="skeleton">Loading schedule…</div>
    </div>
  </div>

  <p class="footnote">One booking per slot. Tap an open slot to claim it, or tap your own booking to release it. Names are self-reported — please keep it accurate so others know who to ask.</p>

</div>

<div class="toast" id="toast" hidden></div>

<script>
(function(){

  // =====================================================================
  // CONFIG — fill these in from your Supabase project (Settings → API)
  // =====================================================================
  const SUPABASE_URL = 'https://ekfuuqztzwfzxgowcyuh.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_-AIecV7asgtPmTMdnG4mhQ_HKtLlk0u';
  // =====================================================================

  // Which hoods are available to book. Add or rename entries here when
  // a new hood arrives — nothing else in the code needs to change.
  const HOODS = [
    { id: 'hood-1', label: 'Hood 1' },
    { id: 'hood-2', label: 'iPSC Hood' }
  ];

  const isConfigured = !SUPABASE_URL.includes('YOUR_') && !SUPABASE_ANON_KEY.includes('YOUR_');
  const supabase = isConfigured ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

  const HOURS = Array.from({length: 12}, (_, i) => i + 8); // 08:00 .. 19:00 start times
  const DAY_NAMES = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const TABLE = 'tc_hood_bookings';

  const state = {
    weekStart: startOfWeek(new Date()),
    bookings: {},
    username: localStorage.getItem('tc-hood-username') || null,
    currentHood: localStorage.getItem('tc-hood-current') || HOODS[0].id,
    currentDayIndex: todayDayIndex(),
    loading: true
  };

  // ---------- date helpers ----------
  function startOfWeek(d){
    const date = new Date(d);
    const day = date.getDay();
    const diff = (day === 0 ? -6 : 1 - day);
    date.setDate(date.getDate() + diff);
    date.setHours(0,0,0,0);
    return date;
  }
  function addDays(d, n){ const r = new Date(d); r.setDate(r.getDate() + n); return r; }
  function fmtKeyDate(d){
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }
  function hourLabel(h){
    const a = String(h).padStart(2,'0') + ':00';
    const b = String(h+1).padStart(2,'0') + ':00';
    return `${a}–${b}`;
  }
  function weekRangeLabel(start){
    const end = addDays(start, 6);
    const opts = { day:'numeric', month:'short' };
    const sameMonth = start.getMonth() === end.getMonth();
    const startStr = start.toLocaleDateString('en-GB', sameMonth ? {day:'numeric'} : opts);
    const endStr = end.toLocaleDateString('en-GB', opts);
    return `${startStr} – ${endStr} ${end.getFullYear()}`;
  }
  function weekKey(){ return fmtKeyDate(state.weekStart); }
  function todayDayIndex(){
    const day = new Date().getDay();
    return day === 0 ? 6 : day - 1; // convert Sun(0)..Sat(6) to Mon(0)..Sun(6)
  }

  // ---------- data layer (Supabase) ----------
  async function loadBookings(weekStartStr, hood){
    const { data, error } = await supabase
      .from(TABLE)
      .select('day_index, hour, name, booked_at')
      .eq('week_start', weekStartStr)
      .eq('hood', hood);
    if(error){ console.error(error); showToast('Could not load the schedule.'); return {}; }
    const map = {};
    data.forEach(row => { map[`${row.day_index}_${row.hour}`] = { name: row.name, bookedAt: row.booked_at }; });
    return map;
  }

  async function bookSlot(weekStartStr, hood, day, hour, name){
    const { error } = await supabase.from(TABLE).insert({
      week_start: weekStartStr, hood, day_index: day, hour, name
    });
    if(error){
      if(error.code === '23505') return { ok:false, reason:'taken' }; // unique constraint hit
      console.error(error);
      return { ok:false, reason:'error' };
    }
    return { ok:true };
  }

  async function cancelSlot(weekStartStr, hood, day, hour, name){
    const { error } = await supabase.from(TABLE).delete()
      .eq('week_start', weekStartStr).eq('hood', hood).eq('day_index', day).eq('hour', hour).eq('name', name);
    if(error){ console.error(error); return false; }
    return true;
  }

  // ---------- toast ----------
  let toastTimer = null;
  function showToast(msg){
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.hidden = true; }, 2600);
  }

  // ---------- rendering ----------
  function renderConfigWarning(){
    const el = document.getElementById('configWarning');
    if(!isConfigured){
      el.innerHTML = `<div class="config-warning">Set SUPABASE_URL and SUPABASE_ANON_KEY near the top of the &lt;script&gt; tag before this will work.</div>`;
    } else {
      el.innerHTML = '';
    }
  }

  function renderUserBlock(){
    const el = document.getElementById('userBlock');
    if(state.username){
      el.innerHTML = `
        <span class="plate__user-label">Booking as</span>
        <span class="plate__user-name">${escapeHtml(state.username)}</span>
        <button class="btn btn--ghost" id="changeNameBtn">change</button>
      `;
    }else{
      el.innerHTML = `
        <span class="plate__user-missing">No name set</span>
        <button class="btn btn--ghost" id="changeNameBtn">set name</button>
      `;
    }
    document.getElementById('changeNameBtn').addEventListener('click', onChangeName);
  }

  function renderHoodTabs(){
    const el = document.getElementById('hoodTabs');
    el.innerHTML = HOODS.map(h =>
      `<button class="hood-tab ${h.id === state.currentHood ? 'hood-tab--active' : ''}" data-hood="${h.id}">${escapeHtml(h.label)}</button>`
    ).join('');
    el.querySelectorAll('.hood-tab').forEach(btn => {
      btn.addEventListener('click', () => onHoodSwitch(btn.dataset.hood));
    });
  }

  function renderBanner(){
    const slot = document.getElementById('bannerSlot');
    if(!state.username){
      slot.innerHTML = `
        <div class="banner">
          <span>Set your name to claim or release slots on this hood.</span>
          <button class="btn btn--primary" id="bannerSetName">Set name</button>
        </div>`;
      document.getElementById('bannerSetName').addEventListener('click', onChangeName);
    }else{
      slot.innerHTML = '';
    }
  }

  function renderWeekLabel(){
    document.getElementById('weekLabel').textContent = weekRangeLabel(state.weekStart);
  }

  function renderGrid(){
    const wrap = document.getElementById('gridWrap');
    if(state.loading){
      wrap.innerHTML = '<div class="skeleton">Loading schedule…</div>';
      return;
    }

    const grid = document.createElement('div');
    grid.className = 'grid';
    grid.style.gridTemplateColumns = '80px repeat(7, 1fr)';

    const corner = document.createElement('div');
    corner.className = 'cell cell--corner';
    grid.appendChild(corner);

    for(let d = 0; d < 7; d++){
      const date = addDays(state.weekStart, d);
      const cell = document.createElement('div');
      cell.className = 'cell cell--day';
      cell.innerHTML = `<strong>${DAY_NAMES[d]}</strong><span>${date.getDate()} ${date.toLocaleDateString('en-GB',{month:'short'})}</span>`;
      grid.appendChild(cell);
    }

    HOURS.forEach(hour => {
      const timeCell = document.createElement('div');
      timeCell.className = 'cell cell--time';
      timeCell.textContent = hourLabel(hour);
      grid.appendChild(timeCell);

      for(let d = 0; d < 7; d++){
        const key = `${d}_${hour}`;
        const entry = state.bookings[key];
        const cell = document.createElement('div');
        cell.className = 'cell';

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.dataset.day = d;
        btn.dataset.hour = hour;

        if(!entry){
          btn.className = 'slot';
          btn.innerHTML = '<span class="slot__name">+</span>';
          btn.title = 'Available — click to book';
        } else if(entry.name === state.username){
          btn.className = 'slot slot--mine';
          btn.innerHTML = `<span class="slot__name">${escapeHtml(entry.name)}</span>`;
          btn.title = 'Your booking — click to release';
        } else {
          btn.className = 'slot slot--taken';
          btn.innerHTML = `<span class="slot__name">${escapeHtml(entry.name)}</span>`;
          btn.title = `Booked by ${entry.name}`;
        }

        cell.appendChild(btn);
        grid.appendChild(cell);
      }
    });

    wrap.innerHTML = '';
    wrap.appendChild(grid);
    wrap.addEventListener('click', onSlotClick);
  }


  function renderDayList(){
    const labelEl = document.getElementById('dayNavLabel');
    const date = addDays(state.weekStart, state.currentDayIndex);
    labelEl.textContent = `${DAY_NAMES[state.currentDayIndex]} ${date.getDate()} ${date.toLocaleDateString('en-GB',{month:'short'})}`;

    const wrap = document.getElementById('dayListWrap');
    if(state.loading){
      wrap.innerHTML = '<div class="skeleton">Loading schedule…</div>';
      return;
    }

    wrap.innerHTML = '';
    HOURS.forEach(hour => {
      const key = `${state.currentDayIndex}_${hour}`;
      const entry = state.bookings[key];

      const row = document.createElement('div');
      row.className = 'day-row';

      const time = document.createElement('div');
      time.className = 'day-row__time';
      time.textContent = hourLabel(hour);
      row.appendChild(time);

      const btn = document.createElement('button');
      btn.type = 'button';
      btn.dataset.day = state.currentDayIndex;
      btn.dataset.hour = hour;

      if(!entry){
        btn.className = 'day-row__slot';
        btn.textContent = 'Available';
      } else if(entry.name === state.username){
        btn.className = 'day-row__slot day-row__slot--mine';
        btn.textContent = `${entry.name} (yours)`;
      } else {
        btn.className = 'day-row__slot day-row__slot--taken';
        btn.textContent = entry.name;
      }

      row.appendChild(btn);
      wrap.appendChild(row);
    });
  }

  async function goToDay(newIndex, newWeekStart){
    if(newWeekStart){
      state.weekStart = newWeekStart;
      state.loading = true;
      renderWeekLabel();
      renderGrid();
      renderDayList();
      state.bookings = isConfigured ? await loadBookings(weekKey(), state.currentHood) : {};
      state.loading = false;
    }
    state.currentDayIndex = newIndex;
    renderGrid();
    renderDayList();
  }

  function renderAll(){
    renderConfigWarning();
    renderUserBlock();
    renderHoodTabs();
    renderBanner();
    renderWeekLabel();
    renderGrid();
    renderDayList();
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ---------- actions ----------
  function onChangeName(){
    const proposed = window.prompt('Your name (shown to lab mates on the schedule):', state.username || '');
    if(proposed === null) return;
    const trimmed = proposed.trim();
    if(!trimmed) return;
    state.username = trimmed;
    localStorage.setItem('tc-hood-username', trimmed);
    renderAll();
  }

  async function onHoodSwitch(hoodId){
    if(hoodId === state.currentHood) return;
    state.currentHood = hoodId;
    localStorage.setItem('tc-hood-current', hoodId);
    renderHoodTabs();
    state.loading = true;
    renderGrid();
    renderDayList();
    state.bookings = isConfigured ? await loadBookings(weekKey(), state.currentHood) : {};
    state.loading = false;
    renderGrid();
    renderDayList();
  }

  async function onSlotClick(e){
    if(!isConfigured){ showToast('Add your Supabase URL and key first.'); return; }
    const btn = e.target.closest('.slot, .day-row__slot');
    if(!btn) return;
    const day = Number(btn.dataset.day);
    const hour = Number(btn.dataset.hour);
    const key = `${day}_${hour}`;
    const entry = state.bookings[key];
    const label = `${DAY_NAMES[day]} ${hourLabel(hour)}`;

    if(!entry){
      if(!state.username){ showToast('Set your name first to book a slot.'); return; }
      const result = await bookSlot(weekKey(), state.currentHood, day, hour, state.username);
      if(result.ok){
        state.bookings[key] = { name: state.username, bookedAt: new Date().toISOString() };
        renderGrid();
        renderDayList();
        showToast(`Booked ${label}.`);
      } else if(result.reason === 'taken'){
        showToast('Someone just booked this slot — refreshing.');
        state.bookings = await loadBookings(weekKey(), state.currentHood);
        renderGrid();
        renderDayList();
      } else {
        showToast('Booking failed — try again.');
      }
    } else if(entry.name === state.username){
      const sure = window.confirm(`Release your booking for ${label}?`);
      if(!sure) return;
      const ok = await cancelSlot(weekKey(), state.currentHood, day, hour, state.username);
      if(ok){
        delete state.bookings[key];
        renderGrid();
        renderDayList();
        showToast('Booking released.');
      } else {
        showToast('Could not update the schedule — try refreshing.');
      }
    } else {
      showToast(`Booked by ${entry.name}.`);
    }
  }

  async function goToWeek(newStart){
    state.weekStart = newStart;
    state.loading = true;
    renderWeekLabel();
    renderGrid();
    renderDayList();
    state.bookings = isConfigured ? await loadBookings(weekKey(), state.currentHood) : {};
    state.loading = false;
    renderGrid();
    renderDayList();
  }

  async function refreshCurrentWeek(){
    if(!isConfigured || state.loading) return;
    state.bookings = await loadBookings(weekKey(), state.currentHood);
    renderGrid();
    renderDayList();
  }

  // Move the day-list forward/back one day at a time, crossing into the
  // adjacent week (and reloading bookings) when stepping past Mon or Sun.
  async function stepDay(delta){
    let newIndex = state.currentDayIndex + delta;
    if(newIndex < 0){
      await goToWeek(addDays(state.weekStart, -7));
      state.currentDayIndex = 6;
    } else if(newIndex > 6){
      await goToWeek(addDays(state.weekStart, 7));
      state.currentDayIndex = 0;
    } else {
      state.currentDayIndex = newIndex;
    }
    renderDayList();
  }

  // ---------- wire up ----------
  document.getElementById('prevWeek').addEventListener('click', () => goToWeek(addDays(state.weekStart, -7)));
  document.getElementById('nextWeek').addEventListener('click', () => goToWeek(addDays(state.weekStart, 7)));
  document.getElementById('thisWeek').addEventListener('click', () => goToWeek(startOfWeek(new Date())));
  document.getElementById('prevDay').addEventListener('click', () => stepDay(-1));
  document.getElementById('nextDay').addEventListener('click', () => stepDay(1));
  document.getElementById('dayListWrap').addEventListener('click', onSlotClick);

  (async function init(){
    renderConfigWarning();
    renderUserBlock();
    renderHoodTabs();
    renderBanner();
    renderWeekLabel();
    state.bookings = isConfigured ? await loadBookings(weekKey(), state.currentHood) : {};
    state.loading = false;
    renderGrid();
    renderDayList();

    if(isConfigured){
      setInterval(refreshCurrentWeek, 15000); // light polling for other people's changes
    }
  })();
})();
</script>

</body>
</html>
